<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Card with Rounded Corners -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGradient)" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="260" rx="16" fill="url(#techGrid)" />

  <!-- Decorative Ambient Glows -->
  <circle cx="200" cy="50" r="140" fill="#0284c7" opacity="0.12" filter="blur(40px)" />
  <circle cx="1000" cy="70" r="160" fill="#8b5cf6" opacity="0.14" filter="blur(50px)" />

  <!-- Subtle Data Structure Elements (Binary Tree Node Art on Right) -->
  <g opacity="0.22" stroke="#818cf8" stroke-width="1.5" fill="none">
    <line x1="1080" y1="40" x2="1040" y2="85" />
    <line x1="1080" y1="40" x2="1120" y2="85" />
    <line x1="1040" y1="85" x2="1015" y2="130" />
    <line x1="1040" y1="85" x2="1065" y2="130" />
    <line x1="1120" y1="85" x2="1145" y2="130" />
    <circle cx="1080" cy="40" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1040" cy="85" r="8" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <circle cx="1120" cy="85" r="8" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <circle cx="1015" cy="130" r="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1065" cy="130" r="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1145" cy="130" r="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Array / Sorting Bars Graphic on Left -->
  <g opacity="0.25" fill="#38bdf8">
    <rect x="70" y="110" width="10" height="35" rx="3" fill="#38bdf8" />
    <rect x="86" y="90" width="10" height="55" rx="3" fill="#818cf8" />
    <rect x="102" y="65" width="10" height="80" rx="3" fill="#a855f7" />
    <rect x="118" y="120" width="10" height="25" rx="3" fill="#38bdf8" />
    <rect x="134" y="50" width="10" height="95" rx="3" fill="#ec4899" />
    <rect x="150" y="80" width="10" height="65" rx="3" fill="#818cf8" />
  </g>

  <!-- Center Content -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 48)">
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
        ⚡ DATA STRUCTURES &amp; ALGORITHMS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#titleGradient)" letter-spacing="0.5" filter="url(#softShadow)">
      Data Structures &amp; Algorithms
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.8">
      Comprehensive, Clean &amp; Highly Optimized Implementations in <tspan fill="#38bdf8" font-weight="700">C</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(600, 184)">
      <!-- Pill 1 -->
      <g transform="translate(-160, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1" opacity="0.9"/>
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#7dd3fc">⚡ High Efficiency</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1" opacity="0.9"/>
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a5b4fc">🧠 Memory Conscious</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(160, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1" opacity="0.9"/>
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#d8b4fe">📚 Interview Ready</text>
      </g>
    </g>
  </g>

  <!-- Dynamic Flowing Waves at the bottom -->
  <!-- Layer 1 -->
  <path d="M 0,260 L 0,225 C 200,205 400,245 600,225 C 800,205 1000,240 1200,220 L 1200,260 Z" fill="url(#waveGrad1)" />

  <!-- Layer 2 -->
  <path d="M 0,260 L 0,235 C 180,215 380,250 580,230 C 780,210 980,245 1200,230 L 1200,260 Z" fill="url(#waveGrad2)" />

  <!-- Layer 3 (Bottom solid-flow edge) -->
  <path d="M 0,260 L 0,245 C 240,230 480,255 720,240 C 960,225 1100,250 1200,245 L 1200,260 Z" fill="url(#waveGrad3)" />
</svg>
