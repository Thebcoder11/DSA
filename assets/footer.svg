<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="auto">
  <defs>
    <!-- Wave Gradients matching header -->
    <linearGradient id="footerWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="footerWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="footerWave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Flowing Waves -->
  <!-- Layer 1 -->
  <path d="M 0,0 C 300,50 600,10 900,45 C 1050,60 1150,30 1200,40 L 1200,120 L 0,120 Z" fill="url(#footerWave1)" />

  <!-- Layer 2 -->
  <path d="M 0,25 C 250,75 550,30 850,65 C 1020,80 1120,45 1200,55 L 1200,120 L 0,120 Z" fill="url(#footerWave2)" />

  <!-- Layer 3 -->
  <path d="M 0,55 C 220,100 500,60 780,90 C 980,105 1100,75 1200,80 L 1200,120 L 0,120 Z" fill="url(#footerWave3)" />
</svg>
